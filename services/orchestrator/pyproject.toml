[project]
name = "clinicalscribe-orchestrator"
version = "0.0.1"
description = "MAF agent runtime. Supervisor + specialist agents + MCP tool calls."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "structlog>=24.4.0",
    "openai>=1.50.0",
    "asyncpg>=0.30.0",
    "azure-cosmos>=4.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]
