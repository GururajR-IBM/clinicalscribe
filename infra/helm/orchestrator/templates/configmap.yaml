apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "orchestrator.fullname" . }}-config
  labels:
    {{- include "orchestrator.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.env.ENVIRONMENT | quote }}
  LOG_LEVEL: {{ .Values.env.LOG_LEVEL | quote }}
  AOAI_API_VERSION: {{ .Values.env.AOAI_API_VERSION | quote }}
  AOAI_DRAFT_MODEL: {{ .Values.env.AOAI_DRAFT_MODEL | quote }}
  AOAI_REVIEW_MODEL: {{ .Values.env.AOAI_REVIEW_MODEL | quote }}
  PORT: {{ .Values.env.PORT | quote }}
