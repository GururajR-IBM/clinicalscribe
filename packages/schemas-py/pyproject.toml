[project]
name = "clinicalscribe-schemas"
version = "0.0.1"
description = "Shared Pydantic v2 domain models used by all Python services."
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.10.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinicalscribe_schemas"]
