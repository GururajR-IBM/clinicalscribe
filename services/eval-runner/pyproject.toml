[project]
name = "clinicalscribe-eval-runner"
version = "0.0.1"
description = "Offline evaluator: medical-correctness, citation-faithfulness, coding accuracy."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "structlog>=24.4.0",
    "rich>=13.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_runner"]
