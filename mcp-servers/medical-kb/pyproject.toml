[project]
name = "clinicalscribe-mcp-medical-kb"
version = "0.0.1"
description = "MCP server exposing curated medical knowledge over Azure AI Search."
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.10.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medical_kb"]
