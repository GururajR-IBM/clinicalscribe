[project]
name = "clinicalscribe-ingestion-worker"
version = "0.0.1"
description = "Service Bus-driven worker: ASR (Speech), OCR (Doc Intel), chunking, embeddings."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "structlog>=24.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion_worker"]
