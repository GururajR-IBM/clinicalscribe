[project]
name = "clinicalscribe-gateway"
version = "0.0.1"
description = "Public API gateway (FastAPI). Auth, session, SSE, signed-url issuance."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
    "sse-starlette>=2.2.0",
    "structlog>=24.4.0",
    "python-jose[cryptography]>=3.3.0",
    "asyncpg>=0.30.0",
    "azure-storage-blob>=12.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]
