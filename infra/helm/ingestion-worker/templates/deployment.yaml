apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ingestion-worker.fullname" . }}
  labels:
    {{- include "ingestion-worker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ingestion-worker.selectorLabels" . | nindent 6 }}
  strategy:
    type: Recreate  # worker maintains DB lock — rolling update risks duplicate processing
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "ingestion-worker.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ingestion-worker.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ingestion-worker
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "ingestion-worker.fullname" . }}-config
            - secretRef:
                name: {{ .Values.envFromSecret.secretName }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp-audio
              mountPath: /tmp
      volumes:
        - name: tmp-audio
          emptyDir:
            medium: Memory
            sizeLimit: 100Mi
