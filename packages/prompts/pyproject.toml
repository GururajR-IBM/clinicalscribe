[project]
name = "clinicalscribe-prompts"
version = "0.0.1"
description = "Centralised agent prompts. Versioned Jinja templates, version-pinned per agent."
requires-python = ">=3.12,<3.13"
dependencies = ["jinja2>=3.1.0", "pydantic>=2.10.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinicalscribe_prompts"]
