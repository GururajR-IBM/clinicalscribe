name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: python · ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - services/gateway
          - services/orchestrator
          - services/ingestion-worker
          - services/eval-runner
          - mcp-servers/medical-kb
          - mcp-servers/drug-interaction
          - mcp-servers/coding
          - mcp-servers/ehr-mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: '0.5.11'
          enable-cache: true
      - name: Sync workspace
        run: uv sync --all-extras --dev
      - name: Lint (ruff)
        run: uv run ruff check ${{ matrix.workspace }}
      - name: Format check (ruff)
        run: uv run ruff format --check ${{ matrix.workspace }}
      - name: Type-check (mypy)
        run: uv run mypy ${{ matrix.workspace }}/src
        continue-on-error: true
      - name: Test
        run: uv run pytest ${{ matrix.workspace }}/tests -q

  node:
    name: node · web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.3.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm --filter @clinicalscribe/web type-check
      - run: pnpm --filter @clinicalscribe/web lint
        continue-on-error: true
      - run: pnpm --filter @clinicalscribe/web build

  e2e:
    name: e2e · Playwright
    runs-on: ubuntu-latest
    needs: node
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.3.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile || pnpm install
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps
      - name: Run Playwright tests
        run: pnpm test:e2e
        env:
          # Tests skip auth-gated scenarios unless a test key is provided
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY_TEST || '' }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY_TEST || '' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/e2e/report/
          retention-days: 7

  terraform:
    name: terraform · fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.3'
      - name: fmt
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
      - run: tflint --chdir infra/terraform --recursive
        continue-on-error: true

  eval:
    name: eval · golden dataset (stub / dry-run)
    runs-on: ubuntu-latest
    needs: python
    defaults:
      run:
        working-directory: services/eval-runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: '0.5.11'
          enable-cache: true
      - name: Install eval-runner
        run: uv pip install -e . --system
      - name: Run golden dataset (stub mode — no AOAI key)
        # In CI no AOAI_KEY is set; rubric returns stub scores.
        # All 5 golden cases should PASS in stub mode (score=7.0, threshold=7.0).
        # When AOAI_KEY is available as a secret, live judge scoring activates.
        run: |
          python -m eval_runner.main --ci || true
        env:
          AOAI_KEY: ${{ secrets.AOAI_KEY || '' }}
          AOAI_ENDPOINT: ${{ secrets.AOAI_ENDPOINT || 'https://localhost' }}
          ORCHESTRATOR_URL: http://localhost:8001
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: services/eval-runner/eval_results/
          retention-days: 30

  helm:
    name: helm · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: '3.16.4'
      - name: Lint gateway
        run: helm lint infra/helm/gateway
      - name: Lint orchestrator
        run: helm lint infra/helm/orchestrator
      - name: Lint ingestion-worker
        run: helm lint infra/helm/ingestion-worker

  docker:
    name: docker · ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: [python, node]
    strategy:
      fail-fast: false
      matrix:
        image:
          - { ctx: ., dockerfile: services/gateway/Dockerfile, tag: gateway }
          - { ctx: ., dockerfile: services/orchestrator/Dockerfile, tag: orchestrator }
          - { ctx: ., dockerfile: services/ingestion-worker/Dockerfile, tag: ingestion-worker }
          - { ctx: ., dockerfile: services/eval-runner/Dockerfile, tag: eval-runner }
          - { ctx: ., dockerfile: apps/web/Dockerfile, tag: web }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.ctx }}
          file: ${{ matrix.image.dockerfile }}
          push: false
          tags: clinicalscribe/${{ matrix.image.tag }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
