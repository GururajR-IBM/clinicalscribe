[project]
name = "clinicalscribe-mcp-coding"
version = "0.0.1"
description = "MCP server for ICD-10 and CPT code lookup (synthetic dataset)."
requires-python = ">=3.12,<3.13"
dependencies = ["mcp>=1.2.0", "pydantic>=2.10.0", "httpx>=0.28.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coding"]
