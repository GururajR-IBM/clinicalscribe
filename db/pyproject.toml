[project]
name = "clinicalscribe-db"
version = "0.0.1"
description = "Alembic migrations for ClinicalScribe Postgres schema."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",
    "sqlalchemy>=2.0.37",
]

[project.scripts]
db-migrate = "alembic:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
