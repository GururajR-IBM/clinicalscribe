# Alembic configuration for ClinicalScribe database migrations
# Migrations target the shared Postgres instance used by gateway + ingestion-worker.
# Run with: alembic upgrade head
# Connection string is read from ALEMBIC_DATABASE_URL env var (sync psycopg2 URL).

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Sync psycopg2 URL for alembic (async asyncpg is used at runtime)
# e.g. postgresql://postgres:postgres@localhost:5432/clinicalscribe
sqlalchemy.url = %(ALEMBIC_DATABASE_URL)s

[post_write_hooks]
# hooks = black (enable once black is a dev dep)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
